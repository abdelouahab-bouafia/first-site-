<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop</title>
    <style>
        /* Reset simple */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        /* Body + Background */
        body {
            min-height: 100vh;
            text-align: center;
            background: linear-gradient(135deg, #1d2671, #220456);
            color: #fff;
        }

        /* Header */
        .header {
            background: #dee2dd;
            height: 60px;
        }

        .nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 100%;
            padding: 0 20px;
        }

        /* Menu navigation horizontale */
        .nav ul {
            list-style: none;
            display: flex;
            gap: 25px;
        }

        .nav ul li a {
            text-decoration: none;
            color: #111;
            font-weight: bold;
            font-size: 16px;
            transition: 0.3s;
        }

        .nav ul li a:hover {
            color: rgb(23, 193, 111);
        }

        /* Logo Right */
        .logo {
            color: black;
        }

        /* Shop Title */
        .shop-title {
            margin: 30px 0;
            font-size: 28px;
            color: #fff;
        }

        /* Products Grid */
        .shop-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin: 30px 0;
        }

        .shop-container .card {
            width: 200px;
            background-color: rgba(24, 21, 70, 0.9);
            border: 2px solid rgb(23, 193, 111);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .shop-container .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        }

        /* Product Images */
        .r2 {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 15px;
        }

        /* Buttons / Links */
        .card a {
            display: inline-block;
            margin-top: 10px;
            text-decoration: none;
            color: #fff;
            background-color: rgb(23, 193, 111);
            padding: 8px 15px;
            border-radius: 10px;
            transition: 0.3s;
        }

        .card a:hover {
            background-color: rgb(18, 150, 85);
        }

        /* Responsive */
        @media (max-width: 600px) {
            .shop-container {
                flex-direction: column;
                align-items: center;
            }
            .shop-container .card {
                width: 90%;
            }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="header">
        <div class="nav">
            <ul>
                <li><a href="connexion.html">Home</a></li>
                <li><a href="shop.html">Shop</a></li>
                <li><a href="contact2.html">Contact</a></li>
            </ul>

            <div class="logo">
                <h3>📱 iPhone Shop</h3>
            </div>
        </div>
    </div>

    <h1 class="shop-title">Bienvenue au Shop</h1>

    <!-- Products Grid -->
    <div class="shop-container">
        <!-- Product 1 -->
        <div class="card">
            <img class="r2" src="produit1.jpeg" alt="Produit 1">
            <h3>iPhone 13 Normal</h3>
            <p>Prix: 3500 DH</p>
            <a href="#">Acheter</a>
        </div>

        <!-- Product 2 -->
        <div class="card">
            <img class="r2" src="produit2.jpeg" alt="Produit 2">
            <h3>iPhone 14 Plus</h3>
            <p>Prix: 4500 DH</p>
            <a href="#">Acheter</a>
        </div>

        <!-- Product 3 -->
        <div class="card">
            <img class="r2" src="produit3.jpeg" alt="Produit 3">
            <h3>iPhone 12 Normal</h3>
            <p>Prix: 2200 DH</p>
            <a href="#">Acheter</a>
        </div>
    </div>

</body>
</html>
